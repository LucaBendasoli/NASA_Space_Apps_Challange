<section id="eyelid-home-page" class="eyelid-page" hidden>
 <h1 tabindex="-1">Início</h1>
 <p>Explore regiões do céu observadas pelo SPHEREx.</p>
 <div class="eyelid-home-layout">
  <section class="eyelid-surface">
   <div class="eyelid-home-tabs" aria-label="Seções do início" role="group">
    <button data-section="community" type="button" aria-pressed="true">Comunidade</button>
    <button data-section="trending" type="button" aria-pressed="false">Em alta</button>
   </div>
   <div id="community-home"></div>
  </section>
  <div>
   <section class="eyelid-surface"><h2>Explore o céu</h2><div id="eyelid-region-links"></div></section>
   <section class="eyelid-surface" id="eyelid-contributors" tabindex="-1"><h2>Top colaboradores</h2><ol id="community-contributors"></ol><p id="community-contributors-empty">Ainda não há contribuições.</p></section>
  </div>
 </div>
</section>
<section id="eyelid-profile-page" class="eyelid-page" hidden>
 <h1 tabindex="-1">Perfil</h1>
 <section class="eyelid-surface eyelid-profile">
  <h2 id="account-status">Você está explorando como visitante</h2>
  <p id="account-email" hidden></p>
  <p id="account-error" role="status" hidden></p>
  <div id="account-guest">
   <button type="button" data-auth-mode="login">Entrar</button>
   <button type="button" data-auth-mode="cadastro">Criar conta</button>
   <button type="button" id="account-judge">Login de jurados</button>
  </div>
  <button type="button" id="account-logout" hidden>Sair</button>
  <button type="button" data-page="map">Voltar ao mapa</button>
 </section>
</section>
<dialog id="eyelid-auth-dialog" aria-label="Entrar no Eyelid">
 <button type="button" id="close-eyelid-auth" aria-label="Fechar login">×</button>
 <iframe title="Cadastro e login do Eyelid"></iframe>
</dialog>
